<table
  {{- range $k, $v := .Attributes }}
    {{- if and $v (ne $k "caption") (ne $k "class") }}
    {{- printf " %s=%q" $k $v | safeHTMLAttr }}
    {{- end }}
  {{- end }}
  class="table{{ with .Attributes.class }} {{ . }}{{ end }}">
  {{- with .Attributes.caption }}
    <caption class="table__caption aside">{{ . | $.Page.RenderString }}</caption>
  {{- end }}
  <thead class="table__head">
    {{- range .THead }}
      <tr class="table__row">
        {{- range . }}
          <th class="table__cell"
            {{- with .Alignment }}
            {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
            {{- end -}}>
            {{- .Text -}}
          </th>
        {{- end }}
      </tr>
    {{- end }}
  </thead>
  <tbody  class="table__body">
    {{- range .TBody }}
      <tr class="table__row">
        {{- range . }}
          <td  class="table__cell"
            {{- with .Alignment }}
            {{- printf " style=%q" (printf "text-align: %s" .) | safeHTMLAttr }}
            {{- end -}}>
            {{- .Text -}}
          </td>
        {{- end }}
      </tr>
    {{- end }}
  </tbody>
</table>
